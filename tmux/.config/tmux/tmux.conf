# Base settings
set -g set-clipboard on

set -g set-clipboard external
set -g @clipboard_threshold 1000  # подтверждение только для >1000 строк

set -g mouse off
set -g escape-time 0 # Remove delay for exiting insert mode with ESC in Neovim
set -g status-interval 1
set -g detach-on-destroy off
set -g repeat-time 1000
set -g history-limit 10000


# change prefix
# unbind C-b
# set -g prefix C-a
set -g prefix C-space

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# : Base binds
# panes
unbind %
unbind '"'
unbind x
unbind c

# bind C-v split-window -v -c "#{pane_current_path}"
# bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# bind C-h split-window -h -c "#{pane_current_path}"
# bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# bind C-x kill-pane
bind x kill-pane
# bind C-c new-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind p previous-window
# bind C-p previous-window
bind n next-window
# bind C-n next-window
bind -r n next-window
bind -r p previous-window

# config reload
unbind r
unbind C-r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

unbind C-s
bind C-s choose-session -Z # session list with C-s




# bind -r h select-pane -L
# bind -r j select-pane -D
# bind -r k select-pane -U
# bind -r l select-pane -R

unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

unbind C-h
unbind C-j
unbind C-k
unbind C-l

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# changing bindings for vim navigator to Alt-<key>
set -g @vim_navigator_mapping_left  "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up    "M-k"
set -g @vim_navigator_mapping_down  "M-j"
set -g @vim_navigator_mapping_prev  ""

bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1
bind -r f resize-pane -Z # maximize
bind -r C-f resize-pane -Z # maximize

# use vi mode
set-window-option -g mode-keys vi
set -g status-keys vi

# vim style copy paste mode
unbind [
# bind C-space copy-mode
# bind Escape copy-mode \; send -X begin-selection
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi = send -X start-of-line

# center cursor while in copy-mode
bind -T copy-mode-vi j                 \
    if-shell -F '#{selection_present}' \
        'send -X cursor-down'          \
        'send -X cursor-down; send -X scroll-middle'

bind -T copy-mode-vi k                 \
    if-shell -F '#{selection_present}' \
        'send -X cursor-up'            \
        'send -X cursor-up; send -X scroll-middle'

bind -T copy-mode-vi C-d \
    if-shell -F '#{selection_present}' \
        'send -N5 -X scroll-down' \
        'send -N5 -X scroll-down; send -X scroll-middle'

bind -T copy-mode-vi C-u \
    if-shell -F '#{selection_present}' \
        'send -N5 -X scroll-up' \
        'send -N5 -X scroll-up; send -X scroll-middle'


bind -T copy-mode-vi Escape if-shell -F "#{?selection_present,1,0}" \
    "send -X clear-selection" \
    "send -X cancel"

# Remove copy by mouse selecting
unbind -T copy-mode-vi MouseDragEnd1Pane

set -g status-position top

source-file ~/.local/share/tmux/theme.conf

set -g status-left-length 70
set -g status-right-length 70
set -g status-justify absolute-centre

set -g pane-border-status top  # или bottom/left/right
set -g pane-border-format " #{pane_index} #(echo '#{pane_current_path}' | awk -F '/' '{if(NF > 2){print \"\"$(NF-1)\"/\"$(NF)}else{print}}' < /dev/stdin) "

# ---
# List of plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

## Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "kitty"
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # colored underscores
set -as terminal-overrides ',kitty:RGB' # true-color support

# vim integration
set -g @plugin 'christoomey/vim-tmux-navigator'

# restoring sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @continuum-boot 'on' # enable automatic start with systemd
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# cpu mem load
# set -g @plugin 'thewtex/tmux-mem-cpu-load'

# ---
#fun Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
