include=~/.local/share/foot/theme.ini

font=CaskaydiaCove Nerd Font:size=14
font-size-adjustment=0.5
line-height=18
box-drawings-uses-font-glyphs=yes
dpi-aware=no

resize-by-cells=yes
resize-keep-grid=yes

[tweak]
grapheme-width-method=double-width

[cursor]
style=beam

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=none
scrollback-up-half-page=SHIFT+CTRL+K
scrollback-down-page=none
scrollback-down-line=none
scrollback-home=none
scrollback-end=none

[search-bindings]
cursor-home=none
cursor-end=none
