# https://wiki.hyprland.org/Configuring/Variables/#general
source = ~/.config/hypr/hyprcolors.conf

env = XCURSOR_THEME,rose-pine-cursor
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,32
env = GTK_CURSOR_THEME,rose-pine-cursor
env = GTK_CURSOR_SIZE,32

exec-once = hyprctl setcursor rose-pine-hyprcursor 32

xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 1

  # gaps_in = 0
  # gaps_out = 0
  # border_size = 2

  col.inactive_border = $base00
  col.active_border = $base07
  resize_on_border = true

  allow_tearing = false

  # snap {
  #   enabled = true
  #   window_gap = 10
  #   monitor_gap = 10
  #   respect_gaps = true
  # }

  # layout = scrolling
}


# # smart gaps (0 gaps when only window)
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = border_size 0, match:float 0, match:workspace w[tv1]
# windowrule = rounding 0, match:float 0, match:workspace w[tv1]
# windowrule = border_size 0, match:float 0, match:workspace f[1]
# windowrule = rounding 0, match:float 0, match:workspace f[1]

# smart gaps (smaller gaps when only window)
$smart_gap = 4
workspace = w[tv1], gapsout:$smart_gap, gapsin:$smart_gap
workspace = f[1], gapsout:$smart_gap, gapsin:$smart_gap
windowrule = border_size 1, match:float 0, match:workspace w[tv1]
windowrule = border_size 1, match:float 0, match:workspace f[1]


# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  # rounding = 8

  rounding = 0

  blur {
    enabled = false
    size = 4
    passes = 2
  }
}

misc {
  disable_hyprland_logo = true
  background_color = $base00
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
  focus_on_activate = false
  middle_click_paste = false
}

cursor {
  no_hardware_cursors = 1
  zoom_factor = 1
  zoom_disable_aa = true
  # persistent_warps = true
  # warp_on_change_workspace = 1
  zoom_rigid  = false
  zoom_detached_camera = false
  # warp_back_after_non_mouse_input = true
  enable_hyprcursor = true
}


animations {
    # adapted animations from https://github.com/end-4/dots-hyprland/blob/f128c48356d17dfbdfff0a708422756eece4bd03/dots/.config/hypr/hyprland/general.conf#L101
    enabled = false

    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    bezier = stall, 1, -0.1, 0.7, 0.85

    # windows
    animation = windowsIn, 1, 2, emphasizedDecel, popin 94%
    animation = fadeIn, 1, 2, emphasizedDecel
    animation = windowsOut, 1, 1, emphasizedDecel, popin 94%
    animation = fadeOut, 1, 1, emphasizedDecel
    animation = windowsMove, 1, 2, emphasizedDecel, slide
    animation = border, 1, 2, emphasizedDecel

    # layers
    animation = layersIn, 1, 2.0, emphasizedDecel, popin 96%
    animation = layersOut, 1, 1.8, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 0.4, menu_decel
    animation = fadeLayersOut, 1, 2.0, stall
    # workspaces
    animation = workspaces, 0, 5, menu_decel, slidefade
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
    # zoom
    animation = zoomFactor, 1, 3, emphasizedDecel
}

