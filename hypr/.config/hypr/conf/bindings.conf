$TRPL = SUPER ALT CTRL

$terminal = kitty
$filemanager = nautilus

###-###
### MAIN SHORTCUTS
### ###

bindd = SUPER, Q, Close window, killactive,
bindd = SUPER, F4, Force close window, forcekillactive,
bindd = $TRPL, Delete, Exit hyprland, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

###-###
### APPLICATIONS
### ###

# Application bindings
# bindd = SUPER, T, Terminal, exec, kitty
bindd = SUPER, T, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(minsh-cmd-terminal-cwd)" --single-instance
bindd = SUPER ALT, T, Terminal, exec, foot
bindd = SUPER, E, File manager, exec, $filemanager
bindd = SUPER CTRL ALT, R, Reload Minsh shell, exec, uwsm-app -- qs -c minsh
# bindd = SUPER, B, Browser, exec, zen
# bindd = SUPER ALT, V, Toggle vpn, exec, ~/.local/bin/toggle-vpn.sh Iluha



###-###
### WORKSPACES MANIPULATIONS
### ###

# Move focus with SUPER + HJKL
bindd = SUPER, H, Move focus left, movefocus, l
bindd = SUPER, J, Move focus down, movefocus, d
bindd = SUPER, K, Move focus up, movefocus, u
bindd = SUPER, L, Move focus right, movefocus, r

# Swap windows with SUPER + arrow keys
bindd = SUPER, LEFT, Swap window to the left, swapwindow, l
bindd = SUPER, DOWN, Swap window down, swapwindow, d
bindd = SUPER, UP, Swap window up, swapwindow, u
bindd = SUPER, RIGHT, Swap window to the right, swapwindow, r

# Switch workspaces with SUPER + [1-9; 0]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bindd = SUPER ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

# Move workspaces to other monitors
bindd = $TRPL, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $TRPL, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $TRPL, UP, Move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $TRPL, DOWN, Move workspace to down monitor, movecurrentworkspacetomonitor, d

# Cycle through applications on active workspace
bindd = ALT, TAB, Cycle to next window, cyclenext
bindd = ALT SHIFT, TAB, Cycle to prev window, cyclenext, prev
bindd = ALT, TAB, Reveal active window on top, bringactivetotop
bindd = ALT SHIFT, TAB, Reveal active window on top, bringactivetotop

# Resize active window
bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

# Resize column in scrolling layout
# bindd = SUPER, code:20, Resize window right, layoutmsg, colresize, -0.1
# bindd = SUPER, code:21, Resize window left, layoutmsg, colresize, +0.1
bindd = SUPER, period, Resize window right in scrolling layout, layoutmsg, colresize +0.1
bindd = SUPER, comma, Resize window right in scrolling layout, layoutmsg, colresize -0.1

# bindd = $TRPL, L, Toggle window split, togglesplit, # dwindle
bindd = SUPER, P, Pin window, pin
# bindd = SUPER SHIFT, P, Pseudo, pseudo


# Toggle floating, center and set size to 800x600
bind = SUPER,  W, exec,                     hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 600; dispatch centerwindow"
bindd = SUPER, F, Toggle window fullscreen, fullscreen,

###-###
### MENUS
### ###

# bindd = SUPER, SPACE, Launch application launcher, global, minsh:open-apps-provider
bindd = SUPER, SPACE, Launch application launcher, exec, walker
bindd = SUPER, M, Launch menu, exec, elephant m minsh-main-menu
bindd = SUPER, SLASH, Keybinds cheatsheet, exec, elephant m minsh-module-hyprland_bindings
# bindd = SUPER, COMMA, Emoji picker, exec, walker -m symbols

###-###
### CLIPBOARD
### ###

bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert,
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert,
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X,
bindd = SUPER CTRL, V, Clipboard manager, exec, elephant m clipboard

# # Captures
bindd =, PRINT, Take screenshot, exec, minsh-screenshot -m region
bindd = ALT, PRINT, Take screenshot, exec, minsh-screenshot -m region -e

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = SUPER,       mouse:272, Move window,   movewindow
bindmd = SUPER,       mouse:273, Resize window, resizewindow 2
bindmd = SUPER SHIFT, mouse:273, Resize window, resizewindow 1 # lock aspect ratio

###-###
### MEDIA
### ###

bindeld =,     XF86AudioRaiseVolume, Volume up,       exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ --limit 1.0
bindeld =,     XF86AudioLowerVolume, Volume down,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindeld = ALT, XF86AudioRaiseVolume, Volume up,       exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.5%+ --limit 1.0
bindeld = ALT, XF86AudioLowerVolume, Volume down,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.5%-
bindeld =,     XF86AudioMute,        Mute,            exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld =,     XF86AudioMicMute,     Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Requires playerctl
bindld =, XF86AudioNext,  Next track,     exec, playerctl next
bindld =, XF86AudioPause, Pause,          exec, playerctl play-pause
bindld =, XF86AudioPlay,  Play,           exec, playerctl play-pause
bindld =, XF86AudioPrev,  Previous track, exec, playerctl previous

# Rewind and fast forward
bindd =, XF86AudioForward, Fast Forward media, exec, playerctl position 5+
bindd =, XF86AudioRewind, Rewind media, exec, playerctl position 5-

# Switch audio output with Super + Mute
# bindld = SUPER, XF86AudioMute, Switch audio output, exec, omarchy-cmd-audio-switch
