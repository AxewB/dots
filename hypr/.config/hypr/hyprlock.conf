# source = ~/.config/omarchy/current/theme/hyprlock.conf
source = ~/.config/hypr/hyprcolors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $base00
    blur_passes = 3
}


input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $base01
    outer_color = $base07
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font
    font_color = $base05

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 8
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}

animations {
  enabled = true

  bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1

  animation = fadeIn, 1, 3, emphasizedDecel
  animation = fadeOut, 1, 2, emphasizedDecel
  animation = inputField, 1, 5, emphasizedDecel
  animation = inputFieldColors, 1, 3, emphasizedDecel
}

