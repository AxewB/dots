[[items]] # tmux
file = "~/.local/share/tmux/theme.conf"
template = "tmux"
subtemplate = "base16"
rewrite = true


[[items]] # zellij
file = "~/.config/zellij/themes/flavours.kdl"
template = "zellij"
subtemplate = "default"
rewrite = true

[[items]] # cava
file = "~/.config/cava/cava.ini"
template = "cava"
rewrite = true

[[items]] # vimiv
file = "~/.config/vimiv/styles/flavours"
template = "vimiv"
rewrite = true

[[items]] # gtk
file = "~/.config/gtk/colors.css"
template = "gtk"
rewrite = true

[[items]] # gtk 3
file = "~/.config/gtk-3.0/colors.css"
template = "gtk"
rewrite = true
hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark'

[[items]] # gtk 4
file = "~/.config/gtk-4.0/colors.css"
template = "gtk"
rewrite = true

[[items]] # wlr-which-key
file = "~/.config/wlr-which-key/config.yaml"
template = "wlr-which-key"
rewrite = false
start = "# start flavours"
end = "# end flavours"

[[items]] # helix
file = "~/.config/helix/themes/flavours.toml"
template = "helix"
rewrite = true

