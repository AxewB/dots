shell = "zsh -c '{}'"

[[items]] # kitty
file = "~/.local/share/kitty/theme.conf"
template = "kitty"
subtemplate = "default-256"                                              # later switch to `default-256`
rewrite = true
hook = "kitty @ set-colors --all '~/.local/share/kitty/theme.conf'"

[[items]] # foot
file = "~/.config/foot/foot.ini"
template = "foot"
rewrite = false
start = "# start flavours"
end = "# end flavours"

[[items]] # neovim
file = "~/.local/share/nvim/theme.lua"
template = "neovim"
rewrite = true

[[items]] # zathura
file = "~/.local/share/zathura/theme"
template = "zathura"
rewrite = true

[[items]] # fzf
file = "~/.local/share/zsh/fzf_theme.sh"
template = "fzf"
subtemplate = "base16-default"
rewrite = true

[[items]] # quickshell minsh
file = "~/.cache/quickshell/minsh/colorscheme.json"
template = "styles"
subtemplate = "json"
rewrite = true

[[items]] # btop
file = "~/.config/btop/themes/flavours.theme"
template = "btop"
rewrite = true

[[items]] # mako
file = "~/.config/mako/theme"
template = "mako"
rewrite = true
hook = "makoctl reload"

[[items]] # hyprland
file = "~/.config/hypr/hyprcolors.conf"
template = "hyprland"
rewrite = true

[[items]] # yazi
file = "~/.config/yazi/theme.toml"
template = "yazi"
rewrite = true

[[items]] # bat
file = "~/.config/bat/themes/flavours.tmTheme"
template = "textmate"
rewrite = true
hook = "bat cache --build"

[[items]] # pywal
file = "~/.cache/wal/colors.json"
template = "pywal"
rewrite = true
hook = "pywalfox update"

