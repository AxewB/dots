# plug in case next file is not available
include ~/.config/kitty/theme.conf
# dynamic file (controlled by flavours utility)
include ~/.local/share/themes/kitty.conf 
# font
bold_italic_font auto
font_size        15.0

font_family CaskaydiaCove Nerd Font
# font_family Iosevka Nerd Font
# Window
window_padding_width 0
hide_window_decorations yes
# ask only if background process is in terminal 
confirm_os_window_close 0
modify_font cell_height 100%

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Allow remote access
allow_remote_control yes

# Aesthetics
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

cursor_trail 1
cursor_trail_start_threshold 3
cursor_trail_decay 0.1 0.15

# cursor_shape block
# shell_integration no-cursor

map ctrl+shift+h nop
